name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          - stable
          - oldstable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
      - name: Test
        run: go test -race -count=1 ./...
      - name: Allocation budgets
        # TestHotPathAllocations pins exact allocs/op budgets for the always-on
        # hot paths; it skips itself under -race (the race runtime allocates),
        # so run it again without -race to make it actually gate.
        run: go test -count=1 -run TestHotPathAllocations .

  fuzz:
    # Crash-safety gate: txnpure runs on the always-on path of an application,
    # so a panic in the classifier, the driver wrapper or a reporter takes the
    # host process down for a problem txnpure only observes. The seed corpora
    # already run in the test job; this job is the generative pass, with a
    # short per-target budget so it stays a PR-time check rather than a soak.
    # Longer runs are `make fuzz FUZZTIME=10m` locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Fuzz
        run: make fuzz FUZZTIME=30s
      - name: Show the failing input
        # go test writes it to testdata/fuzz/<Target>/<hash>; print it so the
        # reproducer survives the job, then commit it as a regression seed.
        if: failure()
        run: find testdata/fuzz -type f -print -exec cat {} \; 2>/dev/null || true

  grpc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          - stable
          - oldstable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: grpc/go.sum
      - name: Check gofmt
        working-directory: grpc
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          working-directory: grpc
      - name: Test
        working-directory: grpc
        run: go test -race -count=1 ./...

  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - examples/nethttp
          - examples/enqueue
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check gofmt
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)"
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          working-directory: ${{ matrix.module }}
      - name: Smoke run
        # Each example is a self-terminating demo that must report at least
        # one violation; build-only would miss runtime regressions.
        working-directory: ${{ matrix.module }}
        run: go run . 2>&1 | tee /tmp/smoke.out && grep -q "side effect inside an open transaction" /tmp/smoke.out

  e2e:
    # Exercises the detector through a real pgx v5 driver against a throwaway
    # PostgreSQL. Unlike go-txnproof there is no server-log cross-check (the
    # property is client-side timing), so no version matrix is needed — one
    # stable major suffices; run.sh initdbs a socket-only cluster (no Docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: e2e/go.sum
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17
      - name: Check gofmt
        working-directory: e2e
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          working-directory: e2e
      - name: Run e2e tests against a throwaway PostgreSQL cluster
        # run.sh prefers binaries on PATH, so prepend the installed version's.
        run: PATH="/usr/lib/postgresql/17/bin:$PATH" ./e2e/run.sh -v
